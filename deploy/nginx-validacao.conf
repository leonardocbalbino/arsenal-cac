# Proxy do stack Docker deste projeto — roda dentro do container `nginx` do
# docker-compose.prod.yml, não tem relação com o nginx do host (que atende
# o cartao-colaborativa via DNS). Sem server_name porque o acesso aqui é só
# por IP:porta, ainda sem domínio.

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # API (NestJS) — prefixo /api já vem do setGlobalPrefix('api') no Nest,
    # então repassa como está (sem strip de prefixo).
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos enviados (documentos, comprovantes) — servidos pelo Nest fora
    # do prefixo /api (ver ServeStaticModule em backend/src/app.module.ts).
    location /uploads/ {
        proxy_pass http://api:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Web (Next.js)
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
