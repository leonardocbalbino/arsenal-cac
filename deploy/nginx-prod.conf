server {
    listen 80;
    listen [::]:80;
    server_name arsenal.cartaocolaborativa.com.br;

    # API (NestJS via PM2, porta 3100 só em localhost) — já responde sob /api
    # (app.setGlobalPrefix('api') no Nest), então NÃO removemos o prefixo aqui.
    location /api/ {
        proxy_pass http://127.0.0.1:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fotos/anexos enviados (multer) — servidos pela API fora do prefixo /api.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3100/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Web (Next.js via PM2, porta 3110 só em localhost) — tudo mais.
    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
